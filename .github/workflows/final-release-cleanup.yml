name: Final release cleanup

on:
  push:
    branches: [roothide]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ROOTLESS_OLD: com.551uk.virtualcam_2.5.32_iphoneos-arm64.deb
      ROOTLESS_NEW: com.551uk.virtualcam_2.5.35_iphoneos-arm64.deb
      ROOTHIDE_DEB: com.551uk.virtualcam_2.5.35-roothide_iphoneos-arm64e.deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roothide
          fetch-depth: 0

      - name: Prepare fresh rootless and RootHide DEBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist rootless-pkg

          # Preserve the known-good rootless payload, but publish it as the current 2.5.35 package.
          gh release download deb --pattern "$ROOTLESS_OLD" --dir /tmp
          dpkg-deb -R "/tmp/$ROOTLESS_OLD" rootless-pkg
          sed -i 's/^Version:.*/Version: 2.5.35/' rootless-pkg/DEBIAN/control
          dpkg-deb --root-owner-group -Zxz -z9 -b rootless-pkg "dist/$ROOTLESS_NEW"

          cp "$ROOTHIDE_DEB" "dist/$ROOTHIDE_DEB"

          test "$(dpkg-deb -f "dist/$ROOTLESS_NEW" Package)" = "com.551uk.virtualcam"
          test "$(dpkg-deb -f "dist/$ROOTLESS_NEW" Version)" = "2.5.35"
          test "$(dpkg-deb -f "dist/$ROOTHIDE_DEB" Package)" = "com.551uk.virtualcam"
          test "$(dpkg-deb -f "dist/$ROOTHIDE_DEB" Version)" = "2.5.35-roothide"

      - name: Delete every old release and tag
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].id' | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$REPO/releases/$id"
          done

          gh api "repos/$REPO/git/matching-refs/tags/" --paginate --jq '.[].ref' | while read -r ref; do
            [ -n "$ref" ] || continue
            name="${ref#refs/tags/}"
            enc="$(jq -rn --arg v "$name" '$v|@uri')"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$enc" || true
          done

      - name: Create only the two fresh releases
        shell: bash
        run: |
          set -euo pipefail

          gh release create v2.5.35             --repo "$REPO"             --target main             --title "Virtual Cam v2.5.35"             --notes ""             "dist/$ROOTLESS_NEW"

          gh release create v2.5.35-roothide             --repo "$REPO"             --target roothide             --title "Virtual Cam v2.5.35 (RootHide)"             --notes ""             "dist/$ROOTHIDE_DEB"

          test "$(gh api "repos/$REPO/releases?per_page=100" --jq 'length')" = "2"
          test "$(gh api "repos/$REPO/releases/tags/v2.5.35" --jq '.assets | length')" = "1"
          test "$(gh api "repos/$REPO/releases/tags/v2.5.35-roothide" --jq '.assets | length')" = "1"

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "551UK cleanup"
          git config user.email "551UK@users.noreply.github.com"
          git rm .github/workflows/final-release-cleanup.yml
          git commit -m "Remove one-time release cleanup workflow"
          git push origin HEAD:roothide
