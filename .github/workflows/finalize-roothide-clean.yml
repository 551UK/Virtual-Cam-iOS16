name: Finalize clean RootHide DEB

on:
  push:
    branches:
      - roothide

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEB: com.551uk.virtualcam_2.5.35-roothide_iphoneos-arm64e.deb
      ROOTLESS: com.551uk.virtualcam_2.5.32_iphoneos-arm64.deb
      ROOTLESS_SHA256: 5d7186bfc0c00f89eb0f3755c0a9a9f658ff72ca0a8e7406b53b746b07f2e523
      MAIN_SHA: b00102b77c25c0659b2ad907ff3824f69522eed2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: roothide
          fetch-depth: 0

      - name: Rebuild clean package from known-working Fix 4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_SHA" || git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

          rm -rf pkg out
          mkdir -p pkg out
          dpkg-deb -R "$DEB" pkg

          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.551uk.virtualcam
          Name: Virtual Cam (RootHide)
          Description: System-wide virtual camera for RootHide iOS 16. Use a selected video or picture in place of the real camera feed.
          Maintainer: 551UK
          Author: 551UK
          Section: Tweaks
          Depends: firmware (>= 16.0), ellekit, com.opa334.libsandy, preferenceloader
          Homepage: https://github.com/551UK/Virtual-Cam-iOS16
          Conflicts: com.551uk.vcamrootless
          Replaces: com.551uk.vcamrootless
          Architecture: iphoneos-arm64e
          Version: 2.5.35-roothide
          EOF

          # One UI dylib, loaded in both places Fix 4 used. This replaces the
          # duplicate diagnostic Camera copy without changing the working UI behavior.
          cat > pkg/Library/MobileSubstrate/DynamicLibraries/VCamUI.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Filter</key>
            <dict>
              <key>Bundles</key>
              <array>
                <string>com.apple.springboard</string>
                <string>com.apple.camera</string>
              </array>
            </dict>
          </dict>
          </plist>
          EOF

          cat > pkg/Library/MobileSubstrate/DynamicLibraries/VCamCore.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>Filter</key><dict><key>Executables</key><array><string>__vcam_roothide_manual__</string></array></dict></dict>
          </plist>
          EOF

          cat > pkg/Library/MobileSubstrate/DynamicLibraries/VCamCameraAudio.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>Filter</key><dict><key>Executables</key><array><string>__vcam_roothide_manual__</string></array></dict></dict>
          </plist>
          EOF

          cat > pkg/Library/MobileSubstrate/DynamicLibraries/VCamAudio.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Filter</key><dict><key>Bundles</key><array><string>com.apple.camera</string></array></dict></dict></plist>
          EOF

          # Remove every old duplicate/test loader if an older package left one behind.
          rm -f             pkg/Library/MobileSubstrate/DynamicLibraries/VCamUIDiagCamera.dylib             pkg/Library/MobileSubstrate/DynamicLibraries/VCamUIDiagCamera.plist             pkg/Library/MobileSubstrate/DynamicLibraries/VCamUICamera.dylib             pkg/Library/MobileSubstrate/DynamicLibraries/VCamUICamera.plist             pkg/usr/libexec/vcam-rh-inject-watch.sh

          cat > pkg/usr/libexec/vcam-rh-core-daemon.sh <<'EOF'
          #!/bin/sh
          # RootHide loader for Virtual Cam's mediaserverd components.
          DIR="/rootfs/var/mobile/Media/DCIM"
          [ -d "$DIR" ] || DIR="/var/mobile/Media/DCIM"
          CONFIG="$DIR/vcam.plist"

          JBROOT="$(/usr/bin/jbroot 2>/dev/null || jbroot 2>/dev/null || true)"
          JBROOT="${JBROOT%/}"
          [ -n "$JBROOT" ] || exit 1

          OPA="$JBROOT/basebin/opainject"
          CORE="$JBROOT/Library/MobileSubstrate/DynamicLibraries/VCamCore.dylib"
          CAUDIO="$JBROOT/Library/MobileSubstrate/DynamicLibraries/VCamCameraAudio.dylib"
          LAUNCHCTL="$JBROOT/usr/bin/launchctl"

          find_msd_pid() {
              _pid=""
              if [ -x "$LAUNCHCTL" ]; then
                  _out="$($LAUNCHCTL print system/com.apple.mediaserverd 2>/dev/null || true)"
                  _pid="$(printf '%s\n' "$_out" | sed -n 's/^[[:space:]]*pid = \([0-9][0-9]*\).*/\1/p' 2>/dev/null | head -n 1 2>/dev/null)"
                  if [ -z "$_pid" ]; then
                      _out="$($LAUNCHCTL list com.apple.mediaserverd 2>/dev/null || true)"
                      _pid="$(printf '%s\n' "$_out" | sed -n 's/.*"PID"[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' 2>/dev/null | head -n 1 2>/dev/null)"
                  fi
              fi
              if [ -z "$_pid" ]; then
                  _ps="$(command -v ps 2>/dev/null || true)"
                  if [ -n "$_ps" ]; then
                      _pid="$($_ps -A -o pid= -o comm= 2>/dev/null | while read p c rest; do
                          case "$c" in mediaserverd|*/mediaserverd) echo "$p"; break;; esac
                      done)"
                  fi
              fi
              printf '%s' "$_pid"
          }

          last_cfg=""
          [ -f "$CONFIG" ] && last_cfg="$(cat "$CONFIG" 2>/dev/null || true)"
          loaded_pid=""

          while :; do
              pid="$(find_msd_pid)"
              if [ -n "$loaded_pid" ] && [ "$pid" != "$loaded_pid" ]; then
                  loaded_pid=""
              fi

              cur_cfg=""
              [ -f "$CONFIG" ] && cur_cfg="$(cat "$CONFIG" 2>/dev/null || true)"

              if [ "$cur_cfg" != "$last_cfg" ]; then
                  last_cfg="$cur_cfg"

                  # Fix 4 only became reliable after the Camera selection had
                  # committed and the capture graph was active.
                  sleep 2
                  pid="$(find_msd_pid)"

                  if [ -n "$pid" ] && [ "$pid" != "$loaded_pid" ] && [ -x "$OPA" ] && [ -r "$CORE" ]; then
                      if "$OPA" "$pid" "$CORE" >/dev/null 2>&1; then
                          [ -r "$CAUDIO" ] && "$OPA" "$pid" "$CAUDIO" >/dev/null 2>&1 || true
                          loaded_pid="$pid"
                      fi
                  fi
              fi

              sleep 1
          done
          EOF

          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          JBROOT="$(/usr/bin/jbroot 2>/dev/null || jbroot 2>/dev/null || true)"
          JBROOT="${JBROOT%/}"
          [ -n "$JBROOT" ] || exit 0

          DIR="/rootfs/var/mobile/Media/DCIM"
          [ -d "$DIR" ] || DIR="/var/mobile/Media/DCIM"
          rm -f "$DIR/vcam-roothide-diagnostic.txt" "$DIR/.vcam-rh-watch.pid" 2>/dev/null || true

          LD="$JBROOT/Library/LaunchDaemons/com.551uk.vcamrhcore.plist"
          mkdir -p "$JBROOT/Library/LaunchDaemons" 2>/dev/null || true
          cat > "$LD" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>com.551uk.vcamrhcore</string>
            <key>Program</key><string>$JBROOT/bin/sh</string>
            <key>ProgramArguments</key>
            <array><string>$JBROOT/bin/sh</string><string>$JBROOT/usr/libexec/vcam-rh-core-daemon.sh</string></array>
            <key>UserName</key><string>root</string>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
            <key>ThrottleInterval</key><integer>3</integer>
            <key>ProcessType</key><string>Interactive</string>
            <key>EnvironmentVariables</key><dict><key>DISABLE_TWEAKS</key><string>1</string></dict>
          </dict>
          </plist>
          PLIST
          chmod 644 "$LD" 2>/dev/null || true
          chown root:wheel "$LD" 2>/dev/null || true

          LC="$JBROOT/usr/bin/launchctl"
          if [ -x "$LC" ]; then
              "$LC" unload "$LD" >/dev/null 2>&1 || true
              "$LC" load "$LD" >/dev/null 2>&1 || true
          fi

          KILLALL="$JBROOT/usr/bin/killall"
          if [ -x "$KILLALL" ]; then
              "$KILLALL" -9 Camera >/dev/null 2>&1 || true
              "$KILLALL" -9 mediaserverd >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          cat > pkg/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          JBROOT="$(/usr/bin/jbroot 2>/dev/null || jbroot 2>/dev/null || true)"
          JBROOT="${JBROOT%/}"
          DIR="/rootfs/var/mobile/Media/DCIM"
          [ -d "$DIR" ] || DIR="/var/mobile/Media/DCIM"

          if [ -n "$JBROOT" ]; then
              LD="$JBROOT/Library/LaunchDaemons/com.551uk.vcamrhcore.plist"
              LC="$JBROOT/usr/bin/launchctl"
              [ -x "$LC" ] && "$LC" unload "$LD" >/dev/null 2>&1 || true
              rm -f "$LD" 2>/dev/null || true
          fi

          rm -f "$DIR/vcam-roothide-diagnostic.txt" "$DIR/.vcam-rh-watch.pid" 2>/dev/null || true

          if [ "$1" = "purge" ]; then
              rm -f "$DIR/vcam.plist" "$DIR/vcam.mp4" "$DIR/vcam.jpg"                     "$DIR/.vcam-camera-heartbeat" "$DIR/.vcam-playback-anchor"                     "$DIR/.vcam-stock-camera-active" 2>/dev/null || true
              rm -rf "/rootfs/var/mobile/Media/VCam" 2>/dev/null || true
          fi
          exit 0
          EOF

          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/postrm pkg/usr/libexec/vcam-rh-core-daemon.sh

          # Keep the preference bundle version aligned with the package.
          python3 - <<'PY'
          import plistlib
          p = "pkg/Library/PreferenceBundles/VCamPrefs.bundle/Info.plist"
          with open(p, "rb") as f:
              d = plistlib.load(f)
          d["CFBundleShortVersionString"] = "2.5.35"
          d["CFBundleVersion"] = "2.5.35"
          with open(p, "wb") as f:
              plistlib.dump(d, f, fmt=plistlib.FMT_BINARY)
          PY

          dpkg-deb --root-owner-group -Zxz -z9 -b pkg "out/$DEB"

          test "$(dpkg-deb -f "out/$DEB" Package)" = "com.551uk.virtualcam"
          test "$(dpkg-deb -f "out/$DEB" Version)" = "2.5.35-roothide"
          test "$(dpkg-deb -f "out/$DEB" Architecture)" = "iphoneos-arm64e"

          rm -rf verify
          mkdir verify
          dpkg-deb -x "out/$DEB" verify

          # No duplicate diagnostic UI dylib or old one-shot watcher remains.
          test ! -e verify/Library/MobileSubstrate/DynamicLibraries/VCamUIDiagCamera.dylib
          test ! -e verify/Library/MobileSubstrate/DynamicLibraries/VCamUIDiagCamera.plist
          test ! -e verify/usr/libexec/vcam-rh-inject-watch.sh

          # The working Camera + SpringBoard UI targets and manual Core loading are present.
          grep -q 'com.apple.camera' verify/Library/MobileSubstrate/DynamicLibraries/VCamUI.plist
          grep -q 'com.apple.springboard' verify/Library/MobileSubstrate/DynamicLibraries/VCamUI.plist
          grep -q '__vcam_roothide_manual__' verify/Library/MobileSubstrate/DynamicLibraries/VCamCore.plist

          mv "out/$DEB" "$DEB"
          sha256sum "$DEB"

      - name: Replace RootHide release asset only
        shell: bash
        run: |
          set -euo pipefail
          # Rootless must remain byte-for-byte the existing release asset.
          rootless_digest="$(gh api "repos/$REPO/releases/tags/deb" --jq '.assets[] | select(.name == "com.551uk.virtualcam_2.5.32_iphoneos-arm64.deb") | .digest')"
          test "$rootless_digest" = "sha256:$ROOTLESS_SHA256"

          gh release upload deb "$DEB" --clobber

          test "$(gh api "repos/$REPO/releases/tags/deb" --jq '.assets | length')" = "2"
          gh api "repos/$REPO/releases/tags/deb" --jq '.assets[].name' | sort > /tmp/assets
          printf '%s\n%s\n' "$ROOTLESS" "$DEB" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/assets

      - name: Commit clean DEB and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pkg out verify
          rm -f .github/workflows/finalize-roothide-clean.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "551UK cleanup"
          git config user.email "551UK@users.noreply.github.com"
          git add -A
          git commit -m "Finalize clean RootHide 2.5.35"
          git push origin HEAD:roothide

          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$MAIN_SHA"
