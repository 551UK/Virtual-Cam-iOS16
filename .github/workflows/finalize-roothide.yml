name: Finalize RootHide repository

on:
  push:
    branches:
      - roothide

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ROOTLESS_ASSET: com.551uk.virtualcam_2.5.32_iphoneos-arm64.deb
      ROOTHIDE_ASSET: com.551uk.virtualcam_2.5.35-roothide_iphoneos-arm64e.deb
      ROOTLESS_SHA256: 5d7186bfc0c00f89eb0f3755c0a9a9f658ff72ca0a8e7406b53b746b07f2e523
      ROOTHIDE_SEED_SHA256: 291aedba88feb6778b63fef98a315e3ecc692bfcf1418b3bbbef426df69caf87
      MAIN_EXPECTED_SHA: b00102b77c25c0659b2ad907ff3824f69522eed2

    steps:
      - name: Check out RootHide branch
        uses: actions/checkout@v4
        with:
          ref: roothide
          fetch-depth: 0

      - name: Verify main is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$MAIN_EXPECTED_SHA"

      - name: Preserve exact current rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download deb --pattern "$ROOTLESS_ASSET" --dir dist
          echo "$ROOTLESS_SHA256  dist/$ROOTLESS_ASSET" | sha256sum -c -

      - name: Expand and validate clean RootHide package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part* | base64 -d > "/tmp/$ROOTHIDE_ASSET"
          echo "$ROOTHIDE_SEED_SHA256  /tmp/$ROOTHIDE_ASSET" | sha256sum -c -

          rm -rf RootHide
          dpkg-deb -R "/tmp/$ROOTHIDE_ASSET" RootHide
          rm -rf bootstrap

          if find RootHide -type f \( -iname '*diag*' -o -iname '*diagnostic*' -o -iname '*fix1*' -o -iname '*fix2*' -o -iname '*fix3*' -o -iname '*fix4*' -o -name 'vcam-rh-inject-watch.sh' \) | grep -q .; then
            echo 'Diagnostic/test files remain in RootHide package layout.'
            exit 1
          fi

          chmod +x build-roothide.sh \
            RootHide/DEBIAN/postinst \
            RootHide/DEBIAN/postrm \
            RootHide/usr/libexec/vcam-rh-core-daemon.sh

          ./build-roothide.sh "dist/$ROOTHIDE_ASSET"
          dpkg-deb -f "dist/$ROOTHIDE_ASSET" Package Version Architecture Name
          test "$(dpkg-deb -f "dist/$ROOTHIDE_ASSET" Package)" = 'com.551uk.virtualcam'
          test "$(dpkg-deb -f "dist/$ROOTHIDE_ASSET" Version)" = '2.5.35-roothide'
          test "$(dpkg-deb -f "dist/$ROOTHIDE_ASSET" Architecture)" = 'iphoneos-arm64e'

      - name: Replace RootHide history with one clean commit on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/finalize-roothide.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git reset origin/main
          git add -A
          git commit -m 'Add clean RootHide build'
          git push --force origin HEAD:roothide

      - name: Replace releases with exactly two DEBs
        shell: bash
        run: |
          set -euo pipefail

          while read -r release_id; do
            [ -n "$release_id" ] || continue
            gh api -X DELETE "repos/$REPO/releases/$release_id"
          done < <(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].id')

          gh api -X DELETE "repos/$REPO/git/refs/tags/deb" >/dev/null 2>&1 || true

          gh release create deb \
            --repo "$REPO" \
            --target main \
            --title 'DEB RELEASE' \
            --notes '' \
            "dist/$ROOTLESS_ASSET" \
            "dist/$ROOTHIDE_ASSET"

          test "$(gh api "repos/$REPO/releases/tags/deb" --jq '.assets | length')" = '2'
          gh api "repos/$REPO/releases/tags/deb" --jq '.assets[].name' | sort > /tmp/assets.txt
          printf '%s\n%s\n' "$ROOTLESS_ASSET" "$ROOTHIDE_ASSET" | sort > /tmp/expected-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/assets.txt

          rootless_digest="$(gh api "repos/$REPO/releases/tags/deb" --jq '.assets[] | select(.name == env.ROOTLESS_ASSET) | .digest')"
          test "$rootless_digest" = "sha256:$ROOTLESS_SHA256"

      - name: Delete every branch except main and roothide
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while read -r branch; do
            case "$branch" in
              main|roothide) continue ;;
            esac
            encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$encoded"
          done

      - name: Verify final repository state
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$MAIN_EXPECTED_SHA"

          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort > /tmp/branches.txt
          printf '%s\n' main roothide | sort > /tmp/expected-branches.txt
          diff -u /tmp/expected-branches.txt /tmp/branches.txt

          test "$(gh api "repos/$REPO/releases?per_page=100" --jq 'length')" = '1'
          test "$(gh api "repos/$REPO/releases/tags/deb" --jq '.assets | length')" = '2'

          echo 'Final branches:'
          cat /tmp/branches.txt
          echo 'Final release assets:'
          gh api "repos/$REPO/releases/tags/deb" --jq '.assets[] | [.name, .digest] | @tsv'
