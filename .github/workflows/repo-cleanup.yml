name: One-time repository cleanup

on:
  push:
    branches: [roothide]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roothide
          fetch-depth: 0

      - name: Keep only main and roothide branches and two DEBs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          rootless="com.551uk.virtualcam_2.5.32_iphoneos-arm64.deb"
          roothide="com.551uk.virtualcam_2.5.35-roothide_iphoneos-arm64e.deb"

          gh api "repos/$repo/branches?per_page=100" --jq '.[].name' | while read -r branch; do
            case "$branch" in
              main|roothide) ;;
              *) gh api -X DELETE "repos/$repo/git/refs/heads/$branch" ;;
            esac
          done

          gh api "repos/$repo/releases?per_page=100" --jq '.[].tag_name' | while read -r tag; do
            if [ "$tag" != "deb" ]; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          if ! gh release view deb >/dev/null 2>&1; then
            gh release create deb --title "DEB RELEASE" --notes ""
          fi

          gh api "repos/$repo/releases/tags/deb" --jq '.assets[] | [.id,.name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            if [ "$name" != "$rootless" ] && [ "$name" != "$roothide" ]; then
              gh api -X DELETE "repos/$repo/releases/assets/$id"
            fi
          done

          if ! gh api "repos/$repo/releases/tags/deb" --jq '.assets[].name' | grep -Fxq "$rootless"; then
            echo "Expected rootless release asset is missing: $rootless" >&2
            exit 1
          fi

          gh release upload deb "$roothide" --clobber

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -e
          git config user.name "551UK cleanup"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repo-cleanup.yml
          git commit -m "Remove one-time cleanup workflow"
          git push origin HEAD:roothide
